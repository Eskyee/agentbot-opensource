# Agentbot Render Blueprint
databases:
  - name: agentbot-db
    databaseName: agentbot
    plan: free
    ipAllowList: []

services:
  # Backend API + MCP Gateway
  - type: web
    name: agentbot-api
    env: docker
    dockerfilePath: Dockerfile
    rootDir: agentbot-backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentbot-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MCP_API_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CDP_API_KEY_NAME
        sync: false
      - key: CDP_API_KEY_PRIVATE_KEY
        sync: false
      - key: CDP_WALLET_SECRET
        sync: false
      - key: BANKR_API_KEY
        sync: false
      - key: MUX_TOKEN_ID
        value: "69db8085-949e-4387-8e3e-cfa7d98d98f0"
      - key: MUX_TOKEN_SECRET
        value: "ITiEk7BVjPfZzEGa9Z3DkFV7z4pwffeTQ/OqmbK01gsrOeDcgRsQOBqd9dIWLkL3jbBlbM0Tkci"
      - key: INTERNAL_API_KEY
        generateValue: true

  # Next.js Frontend
  - type: web
    name: agentbot-web
    env: docker
    dockerfilePath: Dockerfile
    rootDir: web
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_API_URL
        value: "https://agentbot-api.onrender.com"
      - key: NEXT_PUBLIC_BACKEND_URL
        value: "https://agentbot-api.onrender.com"
      - key: BANKR_API_KEY
        sync: false
      - key: MUX_TOKEN_ID
        value: "69db8085-949e-4387-8e3e-cfa7d98d98f0"
      - key: MUX_TOKEN_SECRET
        value: "ITiEk7BVjPfZzEGa9Z3DkFV7z4pwffeTQ/OqmbK01gsrOeDcgRsQOBqd9dIWLkL3jbBlbM0Tkci"

  # Background Worker (BullMQ)
  - type: worker
    name: agentbot-worker
    env: docker
    dockerfilePath: Dockerfile.worker
    rootDir: agentbot-backend
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentbot-redis
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: INTERNAL_API_KEY
        generateValue: true

  # Redis
  - type: redis
    name: agentbot-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
