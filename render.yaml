services:
  # PostgreSQL Database (Managed by Render)
  - type: pserv
    name: agentbot-db
    plan: starter
    region: frankfurt
    postgres:
      version: 15

  # Redis Cache (Managed by Render)
  - type: redis
    name: agentbot-redis
    plan: starter
    region: frankfurt

  # Agentbot Backend API
  - type: web
    name: agentbot-api
    env: docker
    dockerfilePath: agentbot-backend/Dockerfile
    buildCommand: npm run build
    startCommand: npm start
    plan: starter+
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    maxNumInstances: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: agentbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: agentbot-redis
          type: redis
          property: connectionString
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RENDER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://agentbot.onrender.com,http://localhost:3000
    disk:
      name: agentbot-data
      mountPath: /opt/agentbot/data
      sizeGB: 10

  # Agentbot Worker Service (Job Processing)
  - type: worker
    name: agentbot-worker
    env: docker
    dockerfilePath: agentbot-worker/Dockerfile
    buildCommand: npm run build
    startCommand: npm start
    plan: starter
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: agentbot-redis
          type: redis
          property: connectionString
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
