services:
  - type: web
    name: agentbot-api
    runtime: docker
    dockerfilePath: agentbot-backend/Dockerfile.prod
    dockerContext: agentbot-backend
    healthCheckPath: /health
    autoDeploy: true

  - type: worker
    name: agentbot-worker
    runtime: docker
    dockerfilePath: agentbot-worker/Dockerfile.prod
    dockerContext: agentbot-worker
    autoDeploy: true

  - type: web
    name: openclaw-gateway
    runtime: docker
    dockerfilePath: openclaw-gateway/Dockerfile
    dockerContext: openclaw-gateway
    autoDeploy: true

databases:
  - name: agentbot-postgres
