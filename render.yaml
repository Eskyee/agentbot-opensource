# Agentbot Render Blueprint

services:
  # PostgreSQL
  - type: pserv
    name: agentbot-postgres
    plan: starter
    region: oregon

  # Redis
  - type: redis
    name: agentbot-redis
    plan: starter
    region: oregon

  # Backend API
  - type: web
    name: agentbot-api
    runtime: docker
    dockerfilePath: agentbot-backend/Dockerfile.prod
    rootDir: agentbot-backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      - key: SETUP_PASSWORD
        sync: false
    disk:
      name: agentbot-data
      mountPath: /data
      sizeGB: 1
