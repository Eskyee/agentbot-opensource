# Agentbot Render Blueprint

services:
  # PostgreSQL
  - type: pserv
    name: agentbot-postgres
    plan: starter
    region: oregon
    postgres:
      version: 15

  # Redis
  - type: redis
    name: agentbot-redis
    plan: starter
    region: oregon

  # Backend API
  - type: web
    name: agentbot-api
    env: docker
    dockerfilePath: agentbot-backend/Dockerfile
    rootDir: agentbot-backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
    ipAllowList: []

  # Worker
  - type: worker
    name: agentbot-worker
    env: docker
    dockerfilePath: agentbot-worker/Dockerfile
    rootDir: agentbot-worker
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
