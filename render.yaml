# Agentbot Render Blueprint - using pre-built OpenClaw image

services:
  # PostgreSQL
  - type: pserv
    name: agentbot-postgres
    plan: starter
    region: oregon

  # Redis
  - type: redis
    name: agentbot-redis
    plan: starter
    region: oregon

  # OpenClaw - pre-built image
  - type: web
    name: agentbot-api
    image:
      url: ghcr.io/openclaw/openclaw:latest
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
    disk:
      name: agentbot-data
      mountPath: /data
      sizeGB: 1
