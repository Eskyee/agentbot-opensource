# Agentbot Render Blueprint

services:
  # PostgreSQL
  - type: pserv
    name: agentbot-postgres
    plan: starter
    region: oregon

  # Redis
  - type: redis
    name: agentbot-redis
    plan: starter
    region: oregon

  # Backend API
  - type: web
    name: agentbot-api
    env: docker
    dockerfilePath: agentbot-backend/Dockerfile.prod
    rootDir: agentbot-backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

  # Worker
  - type: background_worker
    name: agentbot-worker
    env: docker
    dockerfilePath: agentbot-worker/Dockerfile
    rootDir: agentbot-worker
    plan: starter
    region: oregon
    autoDeploy: true
