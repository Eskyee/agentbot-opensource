services:
  - type: web
    name: agentbot-api
    runtime: docker
    dockerfilePath: agentbot-backend/Dockerfile.prod
    dockerContext: agentbot-backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentbot-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: agentbot-redis
          property: connectionString

  - type: worker
    name: agentbot-worker
    runtime: docker
    dockerfilePath: agentbot-worker/Dockerfile.prod
    dockerContext: agentbot-worker
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentbot-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: agentbot-redis
          property: connectionString

  - type: pserv
    name: agentbot-redis
    runtime: redis
    ipAllowList: []

databases:
  - name: agentbot-postgres
