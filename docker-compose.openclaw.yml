version: '3.8'

services:
  openclaw-gateway:
    image: openclaw:latest
    restart: unless-stopped
    env_file:
      - .openclaw.env
    environment:
      - HOME=/home/node
      - NODE_ENV=development
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_BIND=0.0.0.0
      - OPENCLAW_GATEWAY_PORT=18789
      - XDG_CONFIG_HOME=/home/node/.openclaw
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
    ports:
      - "18789:18789"
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "0.0.0.0",
        "--port",
        "18789",
      ]
    networks:
      - agentbot-network

  openclaw-cli:
    image: openclaw:latest
    env_file:
      - .openclaw.env
    environment:
      - HOME=/home/node
      - NODE_ENV=development
      - XDG_CONFIG_HOME=/home/node/.openclaw
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
    entrypoint: ["node", "dist/index.js"]
    command: ["--help"]
    networks:
      - agentbot-network

volumes:
  openclaw_config:
  openclaw_workspace:

networks:
  agentbot-network:
    external: true
