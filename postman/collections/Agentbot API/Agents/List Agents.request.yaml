$kind: http-request
url: "{{baseUrl}}/api/agents"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response is array or object with agents list", function () {
        var jsonData;
        try { jsonData = pm.response.json(); } catch (e) { pm.expect.fail("Response is not valid JSON"); }
        if (Array.isArray(jsonData)) {
          pm.expect(jsonData).to.be.an("array");
        } else {
          pm.expect(jsonData).to.satisfy(function (d) {
            return d.hasOwnProperty("agents") || d.hasOwnProperty("data");
          }, "Expected response to have 'agents' or 'data' field");
        }
      });
    language: text/javascript
order: 1000
