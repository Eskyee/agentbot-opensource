$kind: http-request
url: "{{x402Url}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response time is acceptable", function () {
        pm.expect(pm.response.responseTime).to.be.below(3000);
      });
    language: text/javascript
order: 4000
