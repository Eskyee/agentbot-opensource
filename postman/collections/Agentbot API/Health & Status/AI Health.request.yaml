$kind: http-request
url: "{{backendUrl}}/api/ai/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response time is acceptable", function () {
        pm.expect(pm.response.responseTime).to.be.below(5000);
      });
      pm.test("Response body has status field", function () {
        var jsonData;
        try { jsonData = pm.response.json(); } catch (e) { pm.expect.fail("Response is not valid JSON"); }
        pm.expect(jsonData).to.have.property("status");
      });
    language: text/javascript
order: 5000
