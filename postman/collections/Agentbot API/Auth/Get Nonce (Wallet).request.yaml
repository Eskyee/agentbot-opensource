$kind: http-request
url: "{{baseUrl}}/api/auth/nonce"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response body has nonce field", function () {
        var jsonData;
        try { jsonData = pm.response.json(); } catch (e) { pm.expect.fail("Response is not valid JSON"); }
        pm.expect(jsonData).to.have.property("nonce");
        pm.expect(jsonData.nonce).to.be.a("string").and.to.have.length.above(0);
      });
    language: text/javascript
order: 8000
