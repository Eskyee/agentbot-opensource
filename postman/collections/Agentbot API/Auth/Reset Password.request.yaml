$kind: http-request
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "",
      "password": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response body has message or success field", function () {
        var jsonData;
        try { jsonData = pm.response.json(); } catch (e) { pm.expect.fail("Response is not valid JSON"); }
        pm.expect(jsonData).to.satisfy(function (d) {
          return d.hasOwnProperty("message") || d.hasOwnProperty("success");
        }, "Expected response to have 'message' or 'success' field");
      });
    language: text/javascript
order: 7000
