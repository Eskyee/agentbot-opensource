<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Mono', monospace, system-ui;
      background: #0a0a0a;
      color: #c9d1d9;
      width: 360px;
      min-height: 480px;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #1a1f2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em; }
    .header .status { font-size: 10px; color: #3fb950; }
    .actions { padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .action-btn {
      background: #14181f;
      border: 1px solid #252d3d;
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .action-btn:hover { border-color: #4a5568; }
    .action-btn .icon { font-size: 20px; margin-bottom: 4px; }
    .action-btn .label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #6b7688; }
    .chat { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .messages { flex: 1; overflow-y: auto; max-height: 240px; margin-bottom: 8px; }
    .message {
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
    }
    .message.user { background: #1a2332; margin-left: 20%; }
    .message.agent { background: #14181f; margin-right: 20%; }
    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1;
      background: #14181f;
      border: 1px solid #252d3d;
      border-radius: 8px;
      padding: 10px 12px;
      color: #c9d1d9;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    .input-row input:focus { border-color: #4a5568; }
    .input-row button {
      background: #2563eb;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      color: white;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .input-row button:hover { background: #1d4ed8; }
    .footer { padding: 8px 12px; border-top: 1px solid #1a1f2e; text-align: center; }
    .footer a { color: #6b7688; font-size: 10px; text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em; }
    .footer a:hover { color: #c9d1d9; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Agentbot</h1>
    <span class="status">● ONLINE</span>
  </div>

  <div class="actions">
    <div class="action-btn" onclick="extractPage()">
      <div class="icon">📄</div>
      <div class="label">Extract</div>
    </div>
    <div class="action-btn" onclick="summarizePage()">
      <div class="icon">📝</div>
      <div class="label">Summarize</div>
    </div>
    <div class="action-btn" onclick="screenshotPage()">
      <div class="icon">📸</div>
      <div class="label">Screenshot</div>
    </div>
    <div class="action-btn" onclick="automateForm()">
      <div class="icon">⚡</div>
      <div class="label">Automate</div>
    </div>
    <div class="action-btn" onclick="searchWeb()">
      <div class="icon">🔍</div>
      <div class="label">Search</div>
    </div>
    <div class="action-btn" onclick="openDashboard()">
      <div class="icon">⚙️</div>
      <div class="label">Dashboard</div>
    </div>
  </div>

  <div class="chat">
    <div class="messages" id="messages">
      <div class="message agent">Hey! I&apos;m your Agentbot. I can extract data, summarize pages, automate forms, or just chat. What do you need?</div>
    </div>
    <div class="input-row">
      <input type="text" id="chatInput" placeholder="Ask your agent..." onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">Send</button>
    </div>
  </div>

  <div class="footer">
    <a href="https://agentbot.sh" target="_blank">agentbot.sh</a>
  </div>

  <script src="src/popup.js"></script>
</body>
</html>
