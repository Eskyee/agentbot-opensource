# Agentbot Opensource Workflow Dependency Update Multi Package Json

## Action

Follow the dependency-update-multi-package-json workflow:
1. Automated tool detects outdated dependencies.
2. Tool updates version numbers in all relevant package.json files (e.g., root, backend, web, gateway).
3. Tool updates the package-lock.json to reflect new dependency tree.
4. Commit is created summarizing all updated packages.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: package.json, package-lock.json, agentbot-backend/package.json

