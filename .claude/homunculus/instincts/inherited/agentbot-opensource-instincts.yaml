# Agentbot Opensource Workflow Dependency Update Batch

## Action

Follow the dependency-update-batch workflow:
1. Detect outdated dependencies (via bot or manually).
2. Update the version numbers in multiple package.json files (root and sub-packages).
3. Update the lockfile (package-lock.json) to reflect new dependency versions.
4. Commit the changes with a summary of updated packages.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: package.json, package-lock.json, agentbot-backend/package.json

