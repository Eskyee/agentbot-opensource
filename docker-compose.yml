version: '3.8'

# DEVELOPMENT ENVIRONMENT ONLY
# These credentials are for local development.
# NEVER use these values in production!
# Update credentials in production deployment.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: startclaw-postgres
    environment:
      POSTGRES_USER: startclaw
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: startclaw_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startclaw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: startclaw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: ./agentbot-backend
      dockerfile: Dockerfile
    container_name: startclaw-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://startclaw:devpassword@postgres:5432/startclaw_db
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-secret-key-12345}
      ALLOWED_ORIGINS: http://localhost:3000,https://startclaw.com
      AGENTS_DOMAIN: agents.localhost
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./agentbot-backend/src:/app/src
    command: npm run dev
    develop:
      watch:
        - path: ./agentbot-backend/src
          action: rebuild

  # Deployment Worker
  worker:
    build:
      context: ./agentbot-worker
      dockerfile: Dockerfile
    container_name: startclaw-worker
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://startclaw:devpassword@postgres:5432/startclaw_db
      AGENTS_DOMAIN: agents.localhost
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agentbot-worker/src:/app/src
    command: npm run dev
    develop:
      watch:
        - path: ./agentbot-worker/src
          action: rebuild

  # Frontend (Next.js)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: startclaw-frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_AGENTS_DOMAIN: agents.localhost
      BACKEND_API_URL: http://api:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-secret-key-12345}
    ports:
      - "3000:3000"
    depends_on:
      - api
    user: root
    volumes:
      - ./web:/app
      - /app/node_modules
    command: sh -c "mkdir -p node_modules && find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true; npm install --include=dev && npm run dev"
    develop:
      watch:
        - path: ./web
          action: rebuild

  # Nginx reverse proxy for local wildcard subdomain testing
  nginx:
    image: nginx:alpine
    container_name: startclaw-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api
    command: nginx -g 'daemon off;'

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: startclaw-network
