# DEVELOPMENT ENVIRONMENT ONLY
# These credentials are for local development.
# NEVER use these values in production!
# Update credentials in production deployment.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agentbot-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: agentbot
      POSTGRES_DB: agentbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: agentbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: ./agentbot-backend
      dockerfile: Dockerfile
    container_name: agentbot-api
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./agentbot-backend/src:/app/src
      - ./runtime-data:/opt/agentbot/data
    command: npm run dev
    develop:
      watch:
        - path: ./agentbot-backend/src
          action: rebuild

  # Deployment Worker
  worker:
    build:
      context: ./agentbot-worker
      dockerfile: Dockerfile
    container_name: agentbot-worker
    env_file:
      - .env
    environment:
      NODE_ENV: development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agentbot-worker/src:/app/src
    command: npm run dev
    develop:
      watch:
        - path: ./agentbot-worker/src
          action: rebuild

  # Frontend (Next.js)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: agentbot-frontend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      BACKEND_API_URL: http://agentbot-api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
    user: root
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev
    develop:
      watch:
        - path: ./web
          action: rebuild

  # Nginx reverse proxy for local wildcard subdomain testing
  nginx:
    image: nginx:alpine
    container_name: agentbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api
    command: nginx -g 'daemon off;'

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: agentbot-network
