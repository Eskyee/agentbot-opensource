# nginx reverse-proxy for the tempo-x402 soul service.
#
# x402-node (Rust/Actix-web) runs on the internal PORT (4024).
# nginx listens on the public PORT (4023) and:
#   GET /          → proxied to /soul/status  (soul cognitive state)
#   everything else → proxied as-is
#
# This fixes the HTTP 404 on the root path without modifying the upstream
# Rust binary. The Borg Dashboard and any client hitting the service URL
# directly will receive the full soul cognitive state JSON.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    # Temp paths writable by the agent user (nginx runs as root here,
    # but we keep them in /tmp to avoid touching the read-only rootfs).
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    upstream x402_node {
        server 127.0.0.1:4024;
        keepalive 16;
    }

    server {
        listen 4023;
        server_name _;

        # Root path → soul cognitive state (same payload as /soul/status).
        # This is what the Borg Dashboard auto-refreshes every 30 seconds.
        location = / {
            proxy_pass         http://x402_node/soul/status;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
        }

        # All other paths pass through unchanged.
        location / {
            proxy_pass         http://x402_node;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }
    }
}
