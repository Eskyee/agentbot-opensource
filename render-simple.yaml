# Agentbot Render Blueprint - Simple & Clean
# Apply via: render-blueprint apply https://raw.githubusercontent.com/Eskyee/agentbot/main/render.yaml

services:
  # PostgreSQL Database
  - type: pserv
    name: agentbot-postgres
    plan: starter
    region: oregon
    postgres:
      version: 15

  # Redis Cache
  - type: redis
    name: agentbot-redis
    plan: starter
    region: oregon

  # Backend API
  - type: web
    name: agentbot-api
    env: docker
    dockerfilePath: agentbot-backend/Dockerfile.prod
    rootDir: agentbot-backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: ALLOWED_ORIGINS
        value: https://agentbot-api.onrender.com,http://localhost:3000

  # Worker
  - type: worker
    name: agentbot-worker
    env: docker
    dockerfilePath: agentbot-worker/Dockerfile
    rootDir: agentbot-worker
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
