<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#111118"/>
      <stop offset="100%" style="stop-color:#0d0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00cc66"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:0"/>
    </linearGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g stroke="#1a1a2e" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="63" x2="1200" y2="693"/>
    <line x1="0" y1="126" x2="1200" y2="756"/>
    <line x1="0" y1="189" x2="1200" y2="819"/>
    <line x1="0" y1="252" x2="1200" y2="882"/>
    <line x1="0" y1="315" x2="1200" y2="945"/>
    <line x1="0" y1="378" x2="1200" y2="1008"/>
    <line x1="0" y1="441" x2="1200" y2="1071"/>
    <line x1="0" y1="504" x2="1200" y2="1134"/>
    <line x1="0" y1="567" x2="1200" y2="1197"/>
    <line x1="0" y1="630" x2="1200" y2="1260"/>
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>
  
  <!-- Glow accent bar -->
  <rect x="250" y="290" width="700" height="3" fill="url(#glow)" filter="url(#glowFilter)"/>
  
  <!-- Logo icon -->
  <g transform="translate(540, 180)">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="#00ff88" opacity="0.1"/>
    <rect x="10" y="10" width="100" height="100" rx="15" fill="none" stroke="#00ff88" stroke-width="3"/>
    <circle cx="60" cy="45" r="15" fill="#00ff88"/>
    <rect x="25" y="75" width="70" height="8" rx="4" fill="#00ff88"/>
    <rect x="35" y="90" width="50" height="6" rx="3" fill="#00ff88" opacity="0.5"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.1em">AGENTBOT</text>
  
  <!-- Tagline -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#888888" text-anchor="middle" letter-spacing="0.05em">Deploy AI Agents in Seconds</text>
  
  <!-- Features -->
  <g transform="translate(200, 470)" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="18">
    <circle cx="10" cy="-4" r="4" fill="#00ff88"/>
    <text x="30">Kimi K2.5 Thinking</text>
    <circle cx="350" cy="-4" r="4" fill="#00ff88"/>
    <text x="370">Crypto &amp; USDC</text>
    <circle cx="680" cy="-4" r="4" fill="#00ff88"/>
    <text x="700">Multi-Channel</text>
  </g>
  
  <!-- CTA button -->
  <rect x="450" y="530" width="300" height="50" rx="25" fill="url(#accent)"/>
  <text x="600" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0a0a0a" text-anchor="middle" letter-spacing="0.05em">Get Started Free →</text>
  
  <!-- URL -->
  <text x="600" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#444444" text-anchor="middle">agentbot.raveculture.xyz</text>
</svg>