# Production Environment Configuration
# All sensitive values use Docker secrets or environment injection

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agentbot-postgres
    environment:
      POSTGRES_USER: agentbot
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: agentbot_db
    secrets:
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: agentbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Backend API
  api:
    build:
      context: ./agentbot-backend
      dockerfile: Dockerfile
    container_name: agentbot-api
    env_file:
      - .env.production
    secrets:
      - stripe_secret_key
      - internal_api_key
      - db_password
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./runtime-data:/opt/agentbot/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Deployment Worker
  worker:
    build:
      context: ./agentbot-worker
      dockerfile: Dockerfile
    container_name: agentbot-worker
    env_file:
      - .env.production
    secrets:
      - stripe_secret_key
      - internal_api_key
      - db_password
    environment:
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime-data:/opt/agentbot/data
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: agentbot-frontend
    env_file:
      - .env.production
    secrets:
      - stripe_public_key
      - nextauth_secret
      - db_password
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_API_URL: http://agentbot-api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: agentbot-network

secrets:
  db_password:
    file: ./secrets/db_password.txt
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_public_key:
    file: ./secrets/stripe_public_key.txt
  internal_api_key:
    file: ./secrets/internal_api_key.txt
  nextauth_secret:
    file: ./secrets/nextauth_secret.txt
