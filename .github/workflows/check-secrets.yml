name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scanner
        run: |
          set -euo pipefail
          FAIL=0

          check() {
            local label="$1"
            local pattern="$2"
            local exclude="${3:-__NONE__}"

            results=$(grep -rn --include="*.ts" --include="*.tsx" \
                              --include="*.js" --include="*.jsx" \
                              --include="*.env*" --include="*.json" \
                              --include="*.sh" --include="*.yml" \
                              -E "$pattern" . 2>/dev/null \
              | grep -v "node_modules" \
              | grep -v ".next" \
              | grep -v "check-secrets.yml" \
              | grep -v "sync-to-opensource.sh" \
              | grep -v "check-secrets.sh" \
              | { [[ "$exclude" == "__NONE__" ]] && cat || grep -v "$exclude"; } \
              || true)

            if [[ -n "$results" ]]; then
              echo "::error::FAIL [$label]"
              echo "$results" | head -20
              FAIL=1
            else
              echo "OK [$label]"
            fi
          }

          # Personal emails
          check "personal gmail"    "[a-zA-Z0-9._%+-]+@gmail\.com" "example@|your@|user@"
          check "personal icloud"   "[a-zA-Z0-9._%+-]+@icloud\.com"
          check "personal domains"  "(rbasefm|djescaba|eskyjunglelab|raveculture)@"

          # Real wallet addresses (40 hex chars after 0x — filter obvious placeholders)
          check "wallet address"    "0x[0-9a-fA-F]{40}" \
            "0xYOUR_WALLET|0x000000|0x123456|example|placeholder|USDC|Token|ERC20"

          # Private infrastructure URLs
          check "railway URLs"      "\.up\.railway\.app"
          check "private subdomains" "borg-[0-9]+-production"

          # Real API keys
          check "re_ resend key"    "re_[A-Za-z0-9]{20,}"
          check "sk- openai key"    "sk-[A-Za-z0-9]{20,}"

          if [[ $FAIL -eq 1 ]]; then
            echo ""
            echo "::error::Secrets detected — push blocked. Strip secrets before pushing to this public repo."
            exit 1
          fi

          echo ""
          echo "All clear — no secrets detected."
