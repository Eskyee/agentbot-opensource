name: Docker Hub Backup

on:
  # Weekly backup instead of on every push to main — building three images on
  # each push was the heaviest consumer of Actions minutes. Run on demand via
  # workflow_dispatch when an immediate backup is needed.
  schedule:
    - cron: '0 4 * * 0' # Sundays at 04:00 UTC
  workflow_dispatch:

jobs:
  backup:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set date tag
        id: date
        run: echo "tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build & push agentbot-web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            junglelab/agentbot-web:latest
            junglelab/agentbot-web:backup-${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push agentbot-backend
        uses: docker/build-push-action@v5
        with:
          context: ./agentbot-backend
          push: true
          tags: |
            junglelab/agentbot-backend:latest
            junglelab/agentbot-backend:backup-${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push agentbot-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: |
            junglelab/agentbot-gateway:latest
            junglelab/agentbot-gateway:backup-${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
