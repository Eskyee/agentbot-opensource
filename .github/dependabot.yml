version: 2
# Ungrouped on purpose: one PR per dependency so security fixes can be
# reviewed and merged individually (each builds in CI before merge).
# Security update PRs are opened automatically when Dependabot security
# updates are enabled in repo Settings → Code security.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    rebase-strategy: auto

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    rebase-strategy: auto

  - package-ecosystem: npm
    directory: /agentbot-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    rebase-strategy: auto

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
