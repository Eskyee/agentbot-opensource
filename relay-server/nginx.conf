worker_processes auto;
daemon off;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        buflen 1s;

        # DJ ingest — each DJ pushes to rtmp://relay.agentbot.sh/live/<stream_key>
        application live {
            live on;
            record off;
            wait_key on;
            wait_video on;
            idle_streams off;

            # Validate stream key and notify backend on publish start/stop
            on_publish http://127.0.0.1:8090/auth/publish;
            on_publish_done http://127.0.0.1:8090/auth/publish_done;

            # Mux primary — stream key is injected per-DJ by the auth callback
            # These are templates; actual push directives are generated dynamically
            # via /etc/nginx/conf.d/push.conf which gets reloaded on relay changes

            # Include dynamically generated push directives
            include /etc/nginx/conf.d/push.conf;
        }
    }
}

http {
    sendfile on;
    tcp_nopush on;
    directio 512;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    server {
        listen 8080;

        # RTMP stat for health checks
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/share/nginx/html;
        }

        # Health endpoint
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"basefm-relay"}';
        }
    }
}
